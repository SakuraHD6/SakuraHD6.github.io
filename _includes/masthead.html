<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item">
            <a href="#about" target="_self"><span data-lang="zh">主页</span><span data-lang="en">Home</span></a>
          </li>
          {% for link in site.data.navigation.main %}
            <li class="masthead__menu-item">
              <a href="{{ domain }}{{ link.url }}" target="_self"><span data-lang="zh">{{ link.title_zh }}</span><span data-lang="en">{{ link.title_en }}</span></a>
            </li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
      <label class="language-selector" aria-label="Language">
        <span class="visually-hidden">Language</span>
        <select data-language-selector aria-label="Language">
          <option value="en" selected>English</option>
          <option value="zh">中文</option>
        </select>
      </label>
    </div>
  </div>
</div>
