<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item">
            <a href="#about" target="_self"><span data-lang="zh">主页</span><span data-lang="en">Home</span></a>
          </li>
          {% for link in site.data.navigation.main %}
            <li class="masthead__menu-item">
              <a href="{{ domain }}{{ link.url }}" target="_self"><span data-lang="zh">{{ link.title_zh }}</span><span data-lang="en">{{ link.title_en }}</span></a>
            </li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
      <div class="language-menu" data-language-menu>
        <button class="language-menu__trigger" type="button" data-language-trigger aria-haspopup="listbox" aria-expanded="false">
          <span class="language-menu__badge" data-language-badge>EN</span>
          <span data-language-current>English</span>
          <span class="language-menu__chevron" aria-hidden="true"></span>
        </button>
        <div class="language-menu__dropdown" data-language-dropdown role="listbox" aria-label="Language" hidden>
          <button class="language-menu__option" type="button" data-language-option="en" role="option" aria-selected="true">
            <span class="language-menu__badge">EN</span>
            <span>English</span>
            <span class="language-menu__check" aria-hidden="true">✓</span>
          </button>
          <button class="language-menu__option" type="button" data-language-option="zh" role="option" aria-selected="false">
            <span class="language-menu__badge">中</span>
            <span>中文</span>
            <span class="language-menu__check" aria-hidden="true">✓</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
